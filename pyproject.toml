[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "n0face"
version = "0.1.0"
description = "Local-only face masking and anonymization for your webcam, published as a virtual camera."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "mediapipe>=0.10.14",
    "pyvirtualcam>=0.11",
    "PySide6-Essentials>=6.7",
    "Pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
bench = ["psutil>=5.9"]

[project.scripts]
n0face-cli = "n0face.cli:main"

[project.gui-scripts]
n0face = "n0face.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
